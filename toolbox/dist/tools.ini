# ============================================================
#  工具启动器 - 工具清单
#  说明:
#    每个 [节] 代表一个工具,节名可以随便写(不重复即可)。
#    路径相对于 Toolkit.exe 所在目录;也可以写绝对路径。
#    修改后按 F5 或点击标题栏右上角的刷新按钮即可生效。
#    左侧分组顺序 = 下面条目第一次出现的顺序。
# ============================================================

[Everything]
